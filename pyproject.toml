[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "consolidation-memory"
version = "0.20.3"
description = "Engineering knowledge layer for agents with provenance, drift awareness, and scoped sharing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Charlie Wright"}]
keywords = [
    "mcp",
    "memory",
    "ai",
    "semantic-search",
    "faiss",
    "agents",
    "persistent-memory",
    "local-first",
    "coding-agents",
    "drift-detection",
    "provenance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=2.3.0,<3",
    "httpx>=0.28.0",
    "faiss-cpu>=1.9.0",
    "scipy>=1.14.0",
    "numpy>=2.0.0",
    "platformdirs>=4.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.4.0"]
openai = ["openai>=1.0.0"]
benchmark = ["openai>=1.0.0"]
rest = ["fastapi>=0.115.0", "uvicorn[standard]>=0.34.0"]
dashboard = ["textual>=1.0.0"]
desktop = ["PySide6>=6.6.0"]
all = ["consolidation-memory[fastembed,openai,rest,dashboard,desktop,benchmark]"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    # Lower bound is not arbitrary: the enforced `select` below names rules that
    # only exist from 0.16.0 (RUF068 among them), and an older ruff aborts on an
    # unknown selector rather than skipping it. Upper bound is deliberate too: the
    # rule set is written against ruff 0.16.10, and a new minor may add, rename or
    # reclassify rules, which would silently change what `ruff check` means here
    # without any edit to this file.
    "ruff>=0.16.10,<0.17",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "build>=1.2.0",
    "twine>=5.1.0",
]

[project.scripts]
consolidation-memory = "consolidation_memory.cli:main"

[project.urls]
Homepage = "https://github.com/charliee1w/consolidation-memory"
Repository = "https://github.com/charliee1w/consolidation-memory"
Documentation = "https://github.com/charliee1w/consolidation-memory#readme"
Issues = "https://github.com/charliee1w/consolidation-memory/issues"
Discussions = "https://github.com/charliee1w/consolidation-memory/discussions"
Changelog = "https://github.com/charliee1w/consolidation-memory/blob/main/CHANGELOG.md"
Releases = "https://github.com/charliee1w/consolidation-memory/releases"
Security = "https://github.com/charliee1w/consolidation-memory/security/policy"

[tool.setuptools.package-data]
consolidation_memory = ["py.typed", "web/index.html", "web/published_metrics.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
# `src` lets isort tell first-party from third-party, so `I001` is stable.
src = [".", "src"]

[tool.ruff.lint]
# The enforced rule set is written out in full, on purpose.
#
# It used to be whatever ruff's defaults happened to be on the machine that last
# ran the lint job. ruff 0.16 replaced the old `E4,E7,E9,F` default with a
# 413-rule set, so a ruff minor bump could change what "green" means here without
# a single edit to this file. The list below pins that set explicitly (verified
# against ruff 0.16.10) and adds the rules this repo was already fixing by hand,
# so the config is now the source of truth rather than a default that drifts.
#
# Where a family is only partly enforced, the count in the comment is
# kept-of-total for that family. Three omissions are load-bearing:
#
#   BLE001  Not selected. Nine legitimate `except Exception` sites live in
#           tests/ (thread fault capture in test_concurrency.py, deliberate
#           `except BaseException` fault injection in test_drift_invalidation.py,
#           and a subprocess kill escalation in test_mcp_stdio_wire.py), and
#           tests/ is outside the edit boundary for the change that introduced
#           this config. Selecting it would either need a project-wide ignore
#           (the thing this file exists to remove) or a per-file-ignores escape
#           hatch. The rule is also unenforceable as a policy: the interesting
#           sites are all in src/, and they have been fixed rather than
#           annotated - see the `contextlib.suppress` conversions in db/connection.py
#           and the narrowed handlers there and in config.py and backends/__init__.py.
#   E501    Not selected. 488 existing lines are over the 100-column limit and
#           no formatter runs in CI, so enforcing it now is a reformat, not a
#           lint fix. line-length stays 100 for new and edited code.
#   E4/E7/E9, W (rest), PLC0415, PLR0911/0912/0913/0915/0917, PLR2004, PLW0108,
#   PLW2901, TC001-TC003, TC006, N806, N801-N803, N818, RET503, RET504, RUF001,
#   RUF043, SIM300, T201, TRY003, TRY300, TRY301, TRY400, most of PTH, PERF203,
#   PERF401, B007, B011, B905, C420: each has live violations in tests/ and/or a
#   refactor-sized backlog in src/. The families below are not mentioned by
#   prefix because none of them has ever been enforced here:
#   A002, ANN, ARG, COM812, CPY001, D1xx-D4xx (D419 excepted), EM101/EM102, FBT,
#   INP001, NPY002, PT001-PT019, Q000, Q003, RSE102, S101, S603, S607, S608,
#   SLF001, TID
#   Enforcing any of them now would mean a green run bought by editing files this
#   change must not touch. They are candidates for a follow-up, not endorsements.
#
# Bandit stays the security gate in CI (`bandit -q -ll -r src scripts -s B608,B110`);
# ruff's `S` selection above is deliberately narrow so the two do not disagree.
select = [
    # pyflakes: undefined names, dead code, bad string formatting (43 rules, whole family)
    "F",
    # pycodestyle: only E722/E902. E4/E7/E9 and E501 are not enforced (2 of 59)
    "E722", "E902",
    # pycodestyle: W605 invalid escape sequence (1 of 7)
    "W605",
    # isort: import block ordering and first-party detection (2 rules, whole family)
    "I",
    # pyupgrade, driven by target-version = py310 (45 rules, whole family)
    "UP",
    # flake8-bugbear, plus B904 so a re-raise never loses its cause (30 of 43)
    "B002", "B003", "B004", "B005", "B006", "B008", "B009", "B010",
    "B012", "B013", "B014", "B015", "B016", "B017", "B018", "B019",
    "B020", "B021", "B022", "B023", "B025", "B026", "B029", "B030",
    "B031", "B032", "B033", "B035", "B039", "B904",
    # flake8-comprehensions: C400-C419 (C420 has a tests/ site, see below) (18 of 20)
    "C400", "C401", "C402", "C403", "C404", "C405", "C406", "C408",
    "C409", "C410", "C411", "C413", "C414", "C415", "C416", "C417",
    "C418", "C419",
    # flake8-simplify, plus SIM105 so every swallow is explicit (22 of 30)
    "SIM101", "SIM102", "SIM103", "SIM105", "SIM107", "SIM113", "SIM114", "SIM115",
    "SIM117", "SIM118", "SIM201", "SIM202", "SIM208", "SIM210", "SIM211", "SIM220",
    "SIM221", "SIM222", "SIM223", "SIM401", "SIM905", "SIM911",
    # flake8-return, plus RET505 (2 of 8)
    "RET501", "RET505",
    # perflint: PERF101/PERF102/PERF402 (3 of 6)
    "PERF101", "PERF102", "PERF402",
    # bandit, aligned with the CI baseline `-s B608,B110` (3 of 71)
    "S102", "S110", "S112",
    # flake8-debugger: T100 (1 of 3)
    "T100",
    # tryceratops, plus TRY004 (suppressed per site, not project-wide) (5 of 10)
    "TRY002", "TRY004", "TRY201", "TRY203", "TRY401",
    # ruff-specific; RUF100 keeps the suppressions in this repo honest (37 of 79)
    "RUF005", "RUF007", "RUF008", "RUF009", "RUF010", "RUF012", "RUF013", "RUF015",
    "RUF016", "RUF017", "RUF018", "RUF019", "RUF020", "RUF022", "RUF023", "RUF024",
    "RUF026", "RUF028", "RUF030", "RUF032", "RUF033", "RUF034", "RUF040", "RUF041",
    "RUF046", "RUF048", "RUF049", "RUF051", "RUF053", "RUF057", "RUF058", "RUF059",
    "RUF063", "RUF068", "RUF100", "RUF101", "RUF200",
    # pylint convention; PLC0415 deferred imports are not enforced (8 of 16)
    "PLC0105", "PLC0131", "PLC0132", "PLC0205", "PLC0206", "PLC0208", "PLC0414", "PLC3002",
    # pylint errors: real bugs (36 rules, whole family)
    "PLE",
    # pylint refactor, correctness half only; no complexity or magic values (13 of 32)
    "PLR0124", "PLR0133", "PLR0206", "PLR0402", "PLR1704", "PLR1708", "PLR1711", "PLR1716",
    "PLR1722", "PLR1730", "PLR1733", "PLR1736", "PLR2044",
    # pylint warnings: real bugs (20 of 29)
    "PLW0120", "PLW0127", "PLW0128", "PLW0129", "PLW0131", "PLW0133", "PLW0177", "PLW0211",
    "PLW0245", "PLW0406", "PLW0602", "PLW0604", "PLW0642", "PLW0711", "PLW1501", "PLW1507",
    "PLW1508", "PLW1509", "PLW1510", "PLW2101",
    # flake8-pytest-style: fixture/assertion form rules (6 of 29)
    "PT010", "PT014", "PT020", "PT025", "PT026", "PT031",
    # flake8-type-checking: runtime-evaluated annotations only (4 of 9)
    "TC004", "TC005", "TC007", "TC010",
    # flake8-async: blocking calls and sleeps inside coroutines (10 of 16)
    "ASYNC100", "ASYNC105", "ASYNC115", "ASYNC116", "ASYNC210", "ASYNC220", "ASYNC221",
    "ASYNC222", "ASYNC230", "ASYNC251",
    # future-annotations: __future__ imports that are already the default (2 rules)
    "FA",
    # flynt: static string that should be an f-string (1 rule)
    "FLY",
    # refurb: behaviour-preserving modernisations (22 rules, whole family)
    "FURB",
    # flake8-logging-format: f-strings passed to logging (8 rules, whole family)
    "G",
    # flake8-import-conventions: numpy as np, and friends (3 rules, whole family)
    "ICN",
    # flake8-gettext: __str__ where __unicode__ was meant (3 rules, whole family)
    "INT",
    # flake8-implicit-str-concat: stray backslash continuations (4 rules, whole family)
    "ISC",
    # flake8-logging: __name__ loggers and redundant exc_info (7 rules, whole family)
    "LOG",
    # pep8-naming: only N999, invalid module name (1 of 16)
    "N999",
    # pygrep-hooks: blanket noqa (3 rules, whole family)
    "PGH",
    # flake8-pie: misc lints (8 rules, whole family)
    "PIE",
    # flake8-use-pathlib: only PTH124/PTH210; the rest is a repo-wide os.path port
    "PTH124", "PTH210",
    # flake8-pyi: stub-file conventions (55 rules, whole family)
    "PYI",
    # flake8-datetimez: naive datetimes (10 rules, whole family)
    "DTZ",
    # eradicate: commented-out code (1 rule)
    "ERA",
    # executable: shebang present but file not executable (5 rules, whole family)
    "EXE",
    # flake8-2020: sys.version rewrites and invalid escapes (10 rules, whole family)
    "YTT",
    # pydocstyle: only D419, the empty-docstring check (1 of 48)
    "D419",
]
# There is no `ignore` and no `per-file-ignores`. Every suppression in this
# repository is a `# noqa` on the line it applies to, carrying its own reason:
#   TRY004  24 sites - argument validators on the dispatch seam raise ValueError
#           by convention (the contract is written out above `_validate_content`
#           in tool_dispatch.py), and 5 payload-shape assertions raise RuntimeError.
#   PLE0604  1 site  - __init__.py builds __all__ from the keys of a dict[str, str].
#   nosec    bandit markers, not ruff suppressions.
# Nothing else is suppressed.

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

# Only genuinely untyped third-party distributions belong here. `mcp` ships
# py.typed, so it is deliberately absent: every access to the SDK goes through
# consolidation_memory.mcp_compat, and the type checker is expected to see the
# real signatures rather than a blanket "Any".
[[tool.mypy.overrides]]
module = [
    "faiss",
    "scipy.*",
    "fastembed.*",
    "openai.*",
    "textual.*",
    "PySide6.*",
    "platformdirs.*",
    "tomli",
    "fastapi.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = []
cache_dir = ".pytest_cache_local"
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

